[changelog]
header = "# Changelog\n\n"
body = """
{% if commits | length > 0 -%}
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endfor %}
{% endif -%}
"""
trim = true
footer = ""
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = true
topo_order_commits = true
sort_commits = "oldest"

# Only changes users notice go into the changelog: features, fixes and performance.
# Everything else (build, docs, refactor, chore, ci, test, style, deps, release and merge commits,
# messages without a type) is left out, and so are features and fixes with an internal scope.

[[git.commit_parsers]]
message = '^(feat|fix|perf)\((build|ci|release|manifest|deps|deps-dev)\)!?:'
skip = true

[[git.commit_parsers]]
message = '^feat(\([^)]*\))?!?:'
group = "<!-- 0 -->Features"

[[git.commit_parsers]]
message = '^fix(\([^)]*\))?!?:'
group = "<!-- 1 -->Fixes"

[[git.commit_parsers]]
message = '^perf(\([^)]*\))?!?:'
group = "<!-- 2 -->Performance"

[[git.commit_parsers]]
message = '.*'
skip = true
