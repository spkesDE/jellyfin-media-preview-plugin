[changelog]
header = ""
body = """
{% set features = commits | filter(attribute="group", value="Features") -%}
{% set fixes = commits | filter(attribute="group", value="Fixes") -%}
{% set performance = commits | filter(attribute="group", value="Performance") -%}

{% for commit in features -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% for commit in fixes -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% for commit in performance -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
"""
trim = true
footer = ""

postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = true
sort_commits = "oldest"

# Only changes users notice go into the changelog: features, fixes and performance.
# Everything else (build, docs, refactor, chore, ci, test, style, deps, release and merge commits,
# messages without a type) is left out, and so are features and fixes with an internal scope.

[[git.commit_parsers]]
message = '^(feat|fix|perf)\((build|ci|release|manifest|deps|deps-dev)\)!?:'
skip = true

[[git.commit_parsers]]
message = '^feat(\([^)]*\))?!?:'
group = "Features"

[[git.commit_parsers]]
message = '^fix(\([^)]*\))?!?:'
group = "Fixes"

[[git.commit_parsers]]
message = '^perf(\([^)]*\))?!?:'
group = "Performance"

[[git.commit_parsers]]
message = '.*'
skip = true
