name: Feature request
description: Suggest an improvement for Jellyfin Media Preview
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case and the behavior you would like to see.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trickplay previews
        - Trailer previews
        - Hover behavior
        - Audio / autoplay
        - Expanded trailer view
        - Visual layout
        - Configuration UI
        - Jellyfin Web compatibility
        - Other
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What would this improvement help you do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe another approach if you have one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, or examples if useful.
